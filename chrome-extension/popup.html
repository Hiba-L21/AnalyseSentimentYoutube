<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Sentiment Analyzer</title>
  <style>
    /* ── Variables ── */
    :root {
      --bg: #ffffff;
      --bg2: #f3f4f6;
      --text: #111827;
      --text2: #6b7280;
      --border: #e5e7eb;
      --pos: #22c55e;
      --neu: #f59e0b;
      --neg: #ef4444;
      --accent: #3b82f6;
      --radius: 10px;
    }
    body.dark {
      --bg: #1f2937;
      --bg2: #111827;
      --text: #f9fafb;
      --text2: #9ca3af;
      --border: #374151;
    }

    /* ── Reset ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      transition: background .2s, color .2s;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 16px; font-weight: 700; }
    header span { font-size: 11px; color: var(--text2); }
    #themeToggle {
      background: none; border: none; cursor: pointer;
      font-size: 18px; padding: 4px;
    }

    /* ── Main ── */
    main { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }

    /* ── Bouton analyse ── */
    #analyzeBtn {
      width: 100%; padding: 10px;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius);
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: opacity .2s;
    }
    #analyzeBtn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Loading ── */
    #loading { display: flex; align-items: center; gap: 10px; color: var(--text2); }
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    #error {
      background: #fef2f2; color: #b91c1c;
      padding: 10px 12px; border-radius: var(--radius);
      border: 1px solid #fecaca; font-size: 13px;
    }
    body.dark #error { background: #450a0a; color: #fca5a5; border-color: #7f1d1d; }

    /* ── Stats cards ── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .stat-card {
      background: var(--bg2); border-radius: var(--radius);
      padding: 10px; text-align: center;
    }
    .stat-card .label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
    .stat-card .count { font-size: 20px; font-weight: 700; }
    .stat-card .pct   { font-size: 11px; color: var(--text2); }
    .stat-card.pos .count { color: var(--pos); }
    .stat-card.neu .count { color: var(--neu); }
    .stat-card.neg .count { color: var(--neg); }

    /* ── Graphique barres ── */
    .chart { display: flex; flex-direction: column; gap: 6px; }
    .chart-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .chart-row span:first-child { width: 58px; color: var(--text2); text-align: right; }
    .bar-track {
      flex: 1; height: 10px; background: var(--bg2);
      border-radius: 999px; overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 999px; transition: width .5s; }

    /* ── Total ── */
    .total-line {
      font-size: 12px; color: var(--text2); text-align: right;
    }

    /* ── Filtres ── */
    .filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border);
      background: none; color: var(--text2); font-size: 12px; cursor: pointer;
      transition: all .15s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }

    /* ── Liste commentaires ── */
    #commentList {
      max-height: 240px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px;
      padding-right: 2px;
    }
    #commentList::-webkit-scrollbar { width: 4px; }
    #commentList::-webkit-scrollbar-track { background: var(--bg2); }
    #commentList::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .comment-item {
      background: var(--bg2); border-radius: var(--radius);
      padding: 10px; display: flex; flex-direction: column; gap: 5px;
    }
    .comment-header { display: flex; align-items: center; justify-content: space-between; }
    .badge {
      font-size: 11px; font-weight: 600; color: #fff;
      padding: 2px 8px; border-radius: 999px;
    }
    .confidence { font-size: 11px; color: var(--text2); }
    .comment-text { font-size: 12px; color: var(--text); line-height: 1.5; }
    .empty { color: var(--text2); font-size: 12px; text-align: center; padding: 16px 0; }

    /* ── Copier ── */
    #copyBtn {
      width: 100%; padding: 8px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 13px; cursor: pointer; transition: background .15s;
    }
    #copyBtn:hover { background: var(--border); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div>
      <h1>YouTube Sentiment</h1>
      <span>Analyse de commentaires</span>
    </div>
    <button id="themeToggle" title="Changer le thème">🌙</button>
  </header>

  <main>
    <!-- Bouton principal -->
    <button id="analyzeBtn">Analyser les commentaires</button>

    <!-- Loading -->
    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <span>Analyse en cours...</span>
    </div>

    <!-- Erreur -->
    <div id="error" class="hidden">
      <strong>Erreur</strong> — <span id="errorMsg"></span>
    </div>

    <!-- Résultats -->
    <div id="results" class="hidden">

      <!-- Cards stats -->
      <div class="stats-grid">
        <div class="stat-card pos">
          <div class="label">Positif</div>
          <div class="count" id="countPositif">0</div>
          <div class="pct"  id="pctPositif">0%</div>
        </div>
        <div class="stat-card neu">
          <div class="label">Neutre</div>
          <div class="count" id="countNeutre">0</div>
          <div class="pct"  id="pctNeutre">0%</div>
        </div>
        <div class="stat-card neg">
          <div class="label">Négatif</div>
          <div class="count" id="countNégatif">0</div>
          <div class="pct"  id="pctNégatif">0%</div>
        </div>
      </div>

      <!-- Graphique -->
      <div class="chart">
        <div class="chart-row">
          <span>Positif</span>
          <div class="bar-track"><div class="bar-fill" id="barPositif"></div></div>
        </div>
        <div class="chart-row">
          <span>Neutre</span>
          <div class="bar-track"><div class="bar-fill" id="barNeutre"></div></div>
        </div>
        <div class="chart-row">
          <span>Négatif</span>
          <div class="bar-track"><div class="bar-fill" id="barNégatif"></div></div>
        </div>
      </div>

      <p class="total-line"><span id="totalCount">0</span> commentaires analysés</p>

      <!-- Filtres -->
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Tous</button>
        <button class="filter-btn" data-filter="Positif">Positif</button>
        <button class="filter-btn" data-filter="Neutre">Neutre</button>
        <button class="filter-btn" data-filter="Négatif">Négatif</button>
      </div>

      <!-- Liste -->
      <div id="commentList"></div>

      <!-- Copier -->
      <button id="copyBtn">Copier les résultats</button>

    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
